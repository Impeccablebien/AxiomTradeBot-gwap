# Example configuration for AxiomTradingBot
# Copy this to config.yaml and edit with your settings

# AxiomTrade API Configuration
axiom_trade:
  email: "your-email@example.com"
  password: "your-base64-encoded-password"  # Use: echo -n "your-password" | base64
  base_url: "https://api6.axiom.trade"

# Trading Configuration
trading:
  default_buy_amount: 0.1        # Default SOL amount for buys
  max_position_size: 1.0         # Maximum SOL per position
  take_profit_percentage: 50.0   # Default take profit %
  stop_loss_percentage: 20.0     # Default stop loss %
  max_positions: 10              # Maximum concurrent positions
  min_liquidity: 5.0             # Minimum liquidity requirement (SOL)
  max_slippage: 5.0              # Maximum slippage tolerance %

# Token Sniping Configuration
sniping:
  enabled: true                  # Enable token sniping
  min_liquidity: 5.0            # Minimum liquidity (SOL)
  max_buy_tax: 10.0             # Maximum buy tax %
  max_sell_tax: 10.0            # Maximum sell tax %
  auto_sell_delay: 60           # Auto-sell delay in seconds (0 = disabled)
  blacklisted_tokens: []        # List of token addresses to avoid
  whitelisted_tokens: []        # List of allowed tokens (empty = all allowed)

# Wallet Tracking Configuration  
wallet_tracking:
  enabled: true
  target_wallets:               # Wallets to track and copy
    - "11111111111111111111111111111112"  # Example wallet
    # Add more wallet addresses here
  copy_percentage: 50.0         # Percentage of their trade size to copy
  min_trade_size: 0.01          # Minimum trade size to copy (SOL)
  max_copy_amount: 1.0          # Maximum amount to copy per trade (SOL)
  delay_seconds: 1              # Delay before copying (seconds)

# Risk Management
risk_management:
  max_daily_loss: 1.0           # Maximum daily loss (SOL)
  max_position_risk: 0.1        # Maximum position size as % of portfolio
  portfolio_rebalance_threshold: 0.2  # Rebalance when allocation differs by %
  emergency_stop_loss: 50.0     # Emergency stop at % total loss

# Notifications
notifications:
  discord:
    enabled: false              # Set to true to enable Discord notifications
    webhook_url: ""             # Your Discord webhook URL
  log_level: "INFO"             # Logging level: DEBUG, INFO, WARNING, ERROR
  enable_trade_alerts: true     # Send alerts for all trades
  enable_error_alerts: true     # Send alerts for errors

# Strategy-specific settings
strategies:
  token_sniper:
    enabled: true
    buy_amount: 0.05            # SOL amount per snipe
    min_liquidity: 10.0         # Higher liquidity requirement for sniping
    max_buy_tax: 5.0            # Lower tax tolerance for sniping
    max_sell_tax: 5.0
    take_profit: 100.0          # Higher profit target for sniped tokens
    stop_loss: 15.0             # Tighter stop loss for quick exits
    
  wallet_tracker:
    enabled: true
    copy_percentage: 30.0       # More conservative copying
    min_trade_size: 0.02        # Slightly higher minimum
    max_copy_amount: 0.5        # Conservative maximum copy amount
    
# Advanced Settings (Optional)
advanced:
  execution_interval: 1.0       # Strategy execution interval (seconds)
  price_update_interval: 5.0    # Price update interval (seconds)
  database_cleanup_days: 90     # Keep data for X days
  max_retries: 3               # Maximum retries for failed operations
  retry_delay: 5.0             # Delay between retries (seconds)
